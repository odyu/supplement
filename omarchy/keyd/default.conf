[ids]
*

[main]
# Cmd keys trigger the cmd layer
leftmeta = layer(cmd)
rightmeta = layer(cmd)

# Caps Lock acts as Cmd
capslock = layer(cmd)

[cmd:meta]
# Essential shortcuts
# Maps Command+Key to Control+Key for standard Linux applications
a = C-a
c = C-c
v = C-v
x = C-x
z = C-z
s = C-s
f = C-f
w = C-w
t = C-t
q = C-q

# Text navigation (Mac-like)
# Cmd+Arrows for beginning/end of line/document
left = home
right = end
up = C-home
down = C-end

# Cmd+Shift+Arrows for selection
S-left = S-home
S-right = S-end
S-up = S-C-home
S-down = S-C-end
