# [ids]
# *

# [main]
# Commandキー (leftmeta, rightmeta) を cmd レイヤに割り当て
# leftmeta = layer(cmd)
# rightmeta = layer(cmd)

# CapsLock をシステム操作専用の Meta (Super) キーとして定義
# capslock = meta

# Commandキー用のレイヤ定義
# meta 継承ではなく control 継承にすることで、Command+C 等が純粋な Ctrl+C として動作します
# [cmd:control]

# --- MacOS風のウィンドウ操作/ランチャー維持設定 ---
# ワークスペース操作は CapsLock に移譲しますが、
# Window切り替え (Cmd+Tab) や ランチャー (Cmd+Space) を Mac の癖で使いたい場合は以下を定義
# tab = M-tab
# space = M-space
# q = M-q
# f = M-f

# --- MacOS風のテキストナビゲーション ---
# Cmd+矢印で文頭・文末移動
# left = home
# right = end
# up = C-home
# down = C-end

# Cmd+Shift+Arrows for selection
# S-left = S-home
# S-right = S-end
# S-up = S-C-home
# S-down = S-C-end
