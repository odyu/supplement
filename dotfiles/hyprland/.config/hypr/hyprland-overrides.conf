################################
# モニタ設定 (Corrected)
################################

# 1. 正面 (4K: LG HDR 4K)
# ID: DP-4
# 注意: 現在のケーブル/ハブでは30Hzが上限のようです(availableModes参照)。
# 60Hz出すにはケーブル交換が必要かもしれません。
monitor = DP-4, preferred, 0x0, 1

# 2. 右側 (2K: LG IPS QHD / 縦置き)
# ID: DP-5
# 配置X座標: 3840 (4Kモニタの幅)
# transform: 3 (270度回転 / 反時計回り90度)
monitor = DP-5, preferred, 3840x0, 1, transform, 3

# 3. 一番右 (本体 3K: Apple Color LCD)
# ID: eDP-1
# 配置X座標: 3840 + 1440 (2K縦置きの幅) = 5280
monitor = eDP-1, preferred, 5280x0, 1


################################
# Fcitx5設定
################################

# 自動起動
# -d: デーモンモード, --replace: 二重起動防止
exec-once = fcitx5 -d --replace

# Bluetoothアプレット (GUI管理ツール)
# 右上のトレイアイコンから接続状況を確認・再接続しやすくなります
exec-once = blueman-applet


input {
    # マウス/トラックパッド共通: Mac風のナチュラルスクロール
    natural_scroll = true
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        # 誤動作防止のためタップクリックは無効化 (物理クリックを使用)
        tap-to-click = false
        # 二本指で右クリック
        clickfinger_behavior = true
    }
}

# 特定デバイスの上書き設定
device {
    name = magic-mouse-white
    sensitivity = -0.6
    natural_scroll = true
    scroll_factor = 4
}

# ---------------------------------------------------------
# Bluetooth Device Auto-Connect
# ---------------------------------------------------------
# 1. Bluetooth電源を確実にON
exec-once = rfkill unblock bluetooth && bluetoothctl power on
# 2. "roBa" キーボードを自動接続 (少し待ってから実行)
exec-once = sleep 2 && bluetoothctl devices | grep "roBa" | awk '{print $2}' | xargs -I {} bluetoothctl connect {}

# 蓋を閉じた (Lid Switch ON) 瞬間にシステムを安全に終了 (Poweroff)
# 暴走・発熱を防ぐため、スリープではなく完全シャットダウンを行います
bindl = , switch:on:Lid Switch, exec, systemctl poweroff
