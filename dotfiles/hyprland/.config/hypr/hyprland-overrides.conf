# ------------------------------------------------------------------------------
# Input Configuration (Mac-like Behavior)
# ------------------------------------------------------------------------------
input {
    # キーボード設定
    kb_layout = us

    # マウス・トラックパッド共通: Macと同じスクロール方向
    natural_scroll = true

    touchpad {
        # タップでクリック
        tap-to-click = false
        # 2本指タップで右クリック
        tap-and-drag = false
        clickfinger_behavior = true
        # Macと同じスクロール方向
        natural_scroll = true
        disable_while_typing = false
    }
}

# デバイス別設定: 通常のマウスの速度を遅く
device {
    name = mouse
    sensitivity = -0.8
}

# ------------------------------------------------------------------------------
# G# ← ★この括弧が抜けていました（inputセクションの終わり）estures (New Syntax for v0.51+)
# ------------------------------------------------------------------------------
gestures {
    # 構文: gesture = 指の数, 方向, アクション

    # 4本指で左右にスワイプ → ワークスペース切り替え (Mac標準挙動)
    gesture = 4, horizontal, workspace
}
