general {
    lock_cmd = pidof hyprlock || hyprlock       # lock before sleep.
    before_sleep_cmd = loginctl lock-session    # lock before sleep.
    after_sleep_cmd = hyprctl dispatch dpms on && (bluetoothctl power on && sleep 2 && bluetoothctl connect $(bluetoothctl devices | grep "roBa" | awk '{print $2}' | head -n 1)) &
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off screen faster if session is locked
listener {
    timeout = 30                                 # 30s
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off # screen off when locked
    on-resume = hyprctl dispatch dpms on          # screen on when activity is detected
}

listener {
    timeout = 300                                # 5min
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 330                                # 5.5min
    on-timeout = hyprctl dispatch dpms off       # screen off
    on-resume = hyprctl dispatch dpms on         # screen on
}

listener {
    timeout = 1800                               # 30min
    on-timeout = systemctl suspend                # suspend pc
}
